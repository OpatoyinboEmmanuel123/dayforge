        s = to24(h1, m1, a2);
        const e2 = to24(h2, m2, a2);
        if (s >= e2)
            s = to24(h1, m1, a2 === "pm" ? "am" : "pm");
    }
    else if (h1 === 12)
        s = 12 * 60 + (m1 || 0);
    else if (h1 >= 7 && h1 <= 11)
        s = h1 * 60 + (m1 || 0);
    else if (h1 >= 1 && h1 <= 6)
        s = (h1 + 12) * 60 + (m1 || 0);
    else
        s = h1 * 60 + (m1 || 0);
    let e;
    if (a2)
        e = to24(h2, m2, a2);

        const am = to24(h2, m2, "am"), pm = to24(h2, m2, "pm");

function parseNote(text) {
    const out = { commitments: [], goals: [], energy: null };
    if (!text || !text.trim())
        return out;
    const names = Object.entries(KIND_WORDS);
    names.forEach(([type, words]) => {
        const range = new RegExp(`\\b(${words})\\b[^.,;\\n]*?(?:from|at|between)?\\s*${T}\\s*(?:-|–|—|to|until|till)\\s*${T}`, "gi");
        let m;
        while ((m = range.exec(text))) {
            const { s, e } = resolveRange(+m[2], +m[3] || 0, meridiem(m[4]), +m[5], +m[6] || 0, meridiem(m[7]), type);
            out.commitments.push({ type, name: cap(m[1].toLowerCase()), start: toHHMM(s), end: toHHMM(e), assumed: false });
        }
        const single = new RegExp(`\\b(${words})\\b[^.,;\\n]*?\\b(?:at|@)\\s*${T}`, "gi");
        while ((m = single.exec(text))) {
            const { s } = resolveRange(+m[2], +m[3] || 0, meridiem(m[4]), +m[2] + 1, 0, null, type);
            const dur = type === "errand" ? 45 : type === "event" ? 90 : 60;
            const start = toHHMM(s);
            if (!out.commitments.some((c) => c.type === type && c.start === start)) {
                out.commitments.push({ type, name: cap(m[1].toLowerCase()), start, end: toHHMM(s + dur), assumed: true });
            }
        }
    });
    const g = new Set();
    if (/backtest|forex|trad(e|ing)\b|chart/i.test(text))
        g.add("forex");
    if (/\bread(ing)?\b|book/i.test(text))
        g.add("reading");
    if (/exercise|workout|gym|\brun(ning)?\b|\bwalk\b|stretch/i.test(text))
        g.add("exercise");
    if (/homework|assignment|study|exam|revision/i.test(text))
        g.add("school");
    if (/business|client|side project/i.test(text))
        g.add("business");
    if (/friend|family|call mom|call dad|relationship/i.test(text))
        g.add("social");
    if (/\brest\b|nap|recover/i.test(text))
        g.add("rest");

    if (/\b(very tired|tired|exhausted|drained|sleepy|burnt out|burned out|low energy)\b/i.test(text))
        out.energy = "low";
    else if (/\b(high energy|energi[sz]ed|fresh|motivated|full of energy)\b/i.test(text))
        out.energy = "high";
    return out;
}

const adapters = {

        async set(k, v) { window.localStorage.setItem(k, v); },
