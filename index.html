    ];
    for (let i = 14; i >= 1; i--) {
        const date = addDays(todayKey, -i);
        const dow = parseKey(date).getDay();
        const wk = dow >= 1 && dow <= 5;
        const text = wk ? weekday[i % weekday.length] : weekend[i % weekend.length];
        const plan = buildPlan({ date, text, opts: {}, commitments: [], wake: user.wake, bed: user.bed, energy: "normal", prefs, variant: i, behavior: { learningBest: i % 2 === 0 ? "evening" : "morning" } });

            if (it.category === "sleep")
                return;
            let p = 0.92;
            if (it.category === "learning")
                p = periodOf(it.start) === "evening" ? 0.9 : periodOf(it.start) === "morning" ? 0.35 : 0.6;
            if (it.category === "reading")
                p = it.end - it.start >= 90 ? 0.25 : 0.8;
            if (it.category === "fitness")
                p = 0.7;
            if (it.category === "creative")
                p = 0.65;
            const r = rnd();
            it.status = r < p ? "done" : r < p + (1 - p) * 0.4 ? "skipped" : "pending";
        });
        plan.accepted = true;
        plan.sample = true;
        plans[date] = plan;
        if (rnd() < 0.85) {
            const prev = plans[addDays(date, -1)];
            const t = texts[i % texts.length];
            const base = prev ? prev.bed % DAY : toMin(user.bed);

        { id: uid(), sample: true, title: "Read every day", why: "A calmer, sharper mind.", targetDate: addDays(todayKey, 90), weeklyTarget: 4, unit: "hours", total: 40, dailyTarget: "30 min", habits: ["Phone in another room"], log: [], categories: ["reading"], milestones: [] },
    ];

    [13, 11, 9, 8, 6, 5, 3, 2].forEach((d, k) => goals[1].log.push({ date: addDays(todayKey, -d), amount: [0.5, 0.5, 1, 0.5, 0.5, 1, 0.5, 0.5][k] }));

const firstSentence = (s) => {
    const c = (s || "").trim().replace(/\s+/g, " ");
    if (!c)
        return "";
    const m = c.match(/^[^.!?]{3,140}[.!?]?/);
    return (m ? m[0] : c.slice(0, 140)).replace(/[.!?]+$/, "");
};
function summarizeJournalLocal(e, plan) {
    const stats = plan ? planStats(plan) : null;
    let lesson;
    if ((e.learned || "").trim())
        lesson = `You learned: ${firstSentence(e.learned)}.`;
    else if ((e.wentWrong || "").trim())
        lesson = `The friction today was: ${firstSentence(e.wentWrong)}.`;
    else if ((e.accomplished || "").trim())
        lesson = `What worked: ${firstSentence(e.accomplished)}.`;
    else
        lesson = "There is not enough written yet to find a lesson. Add one thing that went well and one that did not.";
    if (stats && stats.total)
        lesson += ` You finished ${stats.done} of ${stats.total} planned items (${stats.pct}%).`;
    const parts = [];
    if ((e.unfinished || "").trim())
        parts.push(`Put what slipped first: ${firstSentence(e.unfinished)}.`);
    if (e.energy === "Low")
        parts.push("Protect energy: start wind-down on time and keep tomorrow's plan lighter.");
    if ((e.improve || "").trim())
        parts.push(`${firstSentence(e.improve)}.`);
    const improvement = parts.length ? parts.slice(0, 3).join(" ") : "Keep the plan and repeat what worked. Change one small thing, not everything.";
